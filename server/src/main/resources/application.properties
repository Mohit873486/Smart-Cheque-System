# MySQL Database Connection Settings
spring.datasource.url=jdbc:mysql://localhost:3306/chequeprint_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata&connectTimeout=5000&socketTimeout=10000&tcpKeepAlive=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true&rewriteBatchedStatements=true
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hikari Connection Pool Settings
spring.datasource.hikari.pool-name=ChequePrintHikariPool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=300000
spring.datasource.hikari.initialization-fail-timeout=10000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.leak-detection-threshold=15000

# JPA / Hibernate Properties
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.jpa.properties.hibernate.connection.provider_disables_autocommit=false
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.session.events.log.LOG_QUERIES_SLOWER_THAN_MS=1000

# Logging Configuration
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
logging.level.com.zaxxer.hikari=INFO
logging.level.com.zaxxer.hikari.pool.HikariPool=WARN
logging.level.org.hibernate.SQL_SLOW=INFO
logging.level.org.flywaydb=INFO

# Flyway Migration Settings
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history
spring.flyway.validate-on-migrate=true
spring.flyway.clean-disabled=true
spring.flyway.encoding=UTF-8

# Server Port
server.port=8081

# JWT Configuration
jwt.secret=${JWT_SECRET:Y2hpcXVlcHJpbnRfcHJvZHVjdGlvbl9zZWN1cmVfc2lnbmluZ19rZXlfMjU2X2JpdHM=}

# AI Gemini API Key
gemini.api.key=${GEMINI_API_KEY:}

# DevTools
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=false
spring.devtools.add-properties=true
spring.devtools.restart.poll-interval=1000ms
spring.devtools.restart.quiet-period=400ms
spring.devtools.restart.exclude=static/**,public/**,templates/**